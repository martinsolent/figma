title: "Figma Tutorial"
remote_theme: pmarsceill/just-the-docs

exclude:
  - docs/slides
  - docs/images/doc_set_up_2023/cover_1/Cover_2.png
  - docs/images/doc_set_up_2023/cover_1/delect_cover_2.png
  - docs/images/switch_images/assest..png

# Color scheme currently only supports "dark", "light"/nil (default), or a custom scheme that you define
color_scheme: nil

callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
